# Devices to monitor. Edit names freely; `mdns` entries tie a device to its
# Bonjour instance name or hostname so its IP and HomeKit port are found even
# if DHCP gives it a new address. `ip` is only a fallback.
#
# check: auto (default) = ping, then the HomeKit TCP port; presence = mDNS only;
#        service = HomeKit TCP port only (for things running on this Pi).
# notify: false = record outages but don't send phone alerts.

groups:
  infrastructure:
    - {name: Router, ip: 192.168.0.1, mac: "68:7f:f0:25:44:d0", tcp_port: 80}
